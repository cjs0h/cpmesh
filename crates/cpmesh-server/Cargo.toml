[package]
name = "cpmesh-server"
version = "0.1.0"
edition = "2024"
license.workspace = true

[[bin]]
name = "cpmesh-server"
path = "src/main.rs"

[dependencies]
# Shared workspace crates
cpmesh-proto = { path = "../cpmesh-proto" }

# Web framework
axum = { version = "0.8", features = ["ws", "macros", "multipart"] }
axum-extra = { version = "0.10", features = ["typed-header"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs"] }

# Async
tokio = { version = "1", features = ["full"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "rust_decimal"] }

# Auth
jsonwebtoken = "9"
argon2 = "0.5"

# Crypto (PII encryption)
aes-gcm = "0.10"
hmac = "0.12"
sha2 = "0.10"
rand = "0.8"

# Email
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1-rustls-tls", "builder", "hostname"] }

# HTTP client (for OIDC)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
urlencoding = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

# Rate limiting
governor = "0.8"

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
regex = "1"
rust_decimal = { version = "1", features = ["db-postgres"] }
lazy_static = "1"
futures-util = "0.3"

# Static file embedding
rust-embed = "8"
mime_guess = "2"
