[package]
name = "cpmesh-server"
version = "0.1.0"
edition = "2024"
license.workspace = true

[lib]
name = "cpmesh_server"
path = "src/lib.rs"

[[bin]]
name = "cpmesh-server"
path = "src/main.rs"

[dependencies]
# Shared workspace crates
cpmesh-proto = { path = "../cpmesh-proto" }

# Web framework
axum = { version = "0.8", features = ["ws", "macros", "multipart"] }
tower-http = { version = "0.7", features = ["cors"] }

# Async
tokio = { version = "1", features = ["full"] }

# Database
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "postgres", "uuid", "chrono", "json", "rust_decimal"] }

# Auth
jsonwebtoken = { version = "11", features = ["aws_lc_rs"] }
argon2 = "0.6"

# Crypto (PII encryption)
aes-gcm = "0.11"
hmac = "0.13"
sha2 = "0.11"
rand = "0.10"

# Two-factor authentication: TOTP (HMAC-SHA1) and passkey signature checks use aws-lc-rs,
# the crypto provider rustls already builds; ciborium decodes WebAuthn's CBOR structures.
aws-lc-rs = "1"
ciborium = "0.2"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

# Verifies uploaded installers against the update signing key (same format as the apps)
minisign-verify = "0.3"

# Email (blocking SmtpTransport; rustls with the aws-lc-rs provider shared by reqwest/sqlx/jsonwebtoken)
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "rustls", "aws-lc-rs", "webpki-roots", "builder", "hostname"] }

# HTTP client (for OIDC)
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "rustls"] }
urlencoding = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"

# Rate limiting
governor = "0.10"

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1"
rust_decimal = "1"
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["io"] }

# Static file embedding
rust-embed = "8"
mime_guess = "2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"
