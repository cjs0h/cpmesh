<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- cpmesh mark on the macOS icon grid; generates icon.icns -->
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dy="12" result="blur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.3"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#0a0a0a" filter="url(#shadow)"/>
  <rect x="102" y="102" width="820" height="820" rx="183" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="4"/>
  <path d="M357.50 666.50 L512.00 383.25 L666.50 666.50 Z" fill="none" stroke="#ffffff" stroke-width="46.35" stroke-linejoin="round"/>
  <circle cx="512.00" cy="383.25" r="66.95" fill="#0a0a0a" stroke="#ffffff" stroke-width="46.35"/>
  <circle cx="357.50" cy="666.50" r="66.95" fill="#0a0a0a" stroke="#ffffff" stroke-width="46.35"/>
  <circle cx="666.50" cy="666.50" r="66.95" fill="#ff5c38" stroke="#ffffff" stroke-width="46.35"/>
</svg>
