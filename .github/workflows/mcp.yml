name: MCP CI

on:
  push:
    branches: [main, master]
    paths:
      - "mcp/cpmesh-mcp/**"
      - "scripts/check-deps.mjs"
      - "desktop-tauri/src-tauri/src/crypto/**"
      - "crates/**"
      - "web/**"
      - "Cargo.lock"
      - ".github/workflows/mcp.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "mcp/cpmesh-mcp/**"
      - "scripts/check-deps.mjs"
      - "desktop-tauri/src-tauri/src/crypto/**"
      - "crates/**"
      - "web/**"
      - "Cargo.lock"
      - ".github/workflows/mcp.yml"

# CI only reads the repository; artifacts and caches use the runner's own token
permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The published server supports Node 18.19+ (package.json engines), so every
        # version builds and runs the stdio smoke test; Vitest 5 itself needs Node 22.12+.
        node: [18, 20, 22, 24]
    defaults:
      run:
        working-directory: mcp/cpmesh-mcp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: mcp/cpmesh-mcp/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        if: matrix.node >= 22
      - run: npm run build
      - run: node scripts/smoke.mjs

  vectors:
    name: Golden vectors up to date
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp/cpmesh-mcp
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Regenerate vectors from the desktop Rust crypto
        run: |
          cd vector-gen
          cargo run --release > /tmp/vectors.json
      - name: Compare with committed vectors
        run: diff <(jq -S . /tmp/vectors.json) <(jq -S . test/vectors.json)

  integration:
    name: MCP against the real relay
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cpmesh
          POSTGRES_PASSWORD: cpmesh
          POSTGRES_DB: cpmesh_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cpmesh"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            mcp/cpmesh-mcp/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm --prefix web ci && npm --prefix web run build
      - run: cargo build --locked -p cpmesh-server
      - run: npm --prefix mcp/cpmesh-mcp ci && npm --prefix mcp/cpmesh-mcp run build
      - name: OAuth sign-in (device code and browser), registration proof, persistence ACK, retry, restart and revocation
        env:
          CPMESH_E2E_DATABASE_URL: postgres://cpmesh:cpmesh@127.0.0.1:5432/cpmesh_e2e
        run: node mcp/cpmesh-mcp/scripts/live-smoke.mjs
