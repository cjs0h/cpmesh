name: Web CI

on:
  push:
    branches: [main, master]
    paths:
      - "web/**"
  pull_request:
    branches: [main, master]
    paths:
      - "web/**"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
