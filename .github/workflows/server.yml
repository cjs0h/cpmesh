name: Server CI

on:
  push:
    branches: [main, master]
    paths:
      - "crates/**"
      - "web/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Dockerfile"
      - ".github/workflows/server.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "crates/**"
      - "web/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Dockerfile"
      - ".github/workflows/server.yml"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

# CI only reads the repository; artifacts and caches use the runner's own token
permissions:
  contents: read

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build web frontend
        working-directory: web
        run: npm ci && npm run build
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        # Keep in sync with the image used in docker-compose.yml
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cpmesh
          POSTGRES_PASSWORD: cpmesh
          POSTGRES_DB: cpmesh_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cpmesh"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Enables the PostgreSQL-backed integration tests in crates/cpmesh-server/tests/db.rs
      TEST_DATABASE_URL: postgres://cpmesh:cpmesh@localhost:5432/cpmesh_test
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build web frontend
        working-directory: web
        run: npm ci && npm run build
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - run: cargo audit

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build server image (not pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
